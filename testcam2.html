<div style="width:640px;height:480px;">
  <video id="webcam" controls width="640" height="480" autoplay muted style="width:100%;height:100%;"></video>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
  const src = 'https://cam.ntchelp.com/cam1/index.m3u8?video=h264';  // Video-only
  if (Hls.isSupported()) {
    var hls = new Hls({enableWorker: false, lowLatencyMode: true});
    hls.loadSource(src);
    hls.attachMedia(document.getElementById('webcam'));
  } else {
    document.getElementById('webcam').src = src;
  }
</script>
