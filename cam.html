<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live Camera</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    #container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    #v {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
    #fs {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      padding: 14px 22px;
      background: rgba(0,0,0,0.85);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
      opacity: 1;
      touch-action: manipulation;
    }
    @media (max-width: 768px) {
      #fs {
        padding: 16px 24px;
        font-size: 18px;
        bottom: 25px;
        right: 25px;
      }
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="v" playsinline></video>
    <button id="fs" onclick="toggleFS()">⛶ Fullscreen</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script>
    const container = document.getElementById('container');
    const v = document.getElementById('v');
    const btn = document.getElementById('fs');
    const src = 'https://cam.ntchelp.com/cam1/index.m3u8?video=h264&hls_segment_count=2';

    v.controls = false;
    v.muted = true;

    function toggleFS() {
      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      } else {
        if (container.requestFullscreen) container.requestFullscreen({navigationUI:'hide'});
        else if (container.webkitRequestFullscreen) container.webkitRequestFullscreen();
        else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();   // iOS Safari
      }
    }

    // Load stream
    if (Hls.isSupported()) {
      const hls = new Hls({
        enableWorker: false,
        lowLatencyMode: true,
        autoStartLoad: true,
        liveSyncDurationCount: 2
      });
      hls.loadSource(src);
      hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
    } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
      v.src = src;
      v.play().catch(() => {});
    }

    // Update button text
    document.addEventListener('fullscreenchange', updateButton);
    document.addEventListener('webkitfullscreenchange', updateButton);

    function updateButton() {
      const isFS = document.fullscreenElement || document.webkitFullscreenElement;
      btn.textContent = isFS ? '❌ Exit' : '⛶ Fullscreen';
    }
  </script>
</body>
</html>
